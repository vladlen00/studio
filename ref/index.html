.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--dark);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}

.sheet-bg{position:fixed;inset:0;background:rgba(43,29,38,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet-bg[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:14px;font-size:15px;line-height:1.55}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:30;padding:20px}
.viewer[hidden]{display:none}
.viewer img{max-width:100%;max-height:80vh;border-radius:12px;-webkit-touch-callout:default}
.viewer p{color:#fff;font-size:15px;margin:0;text-align:center}
</style>

  // ---------- тексты ----------

  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var a = b.getAttribute("data-act");
    if (a === "back") back();
    else if (a === "copy") { if (copyText(DATA.link)) { toast(T("common.copied")); haptic(); } }
    else if (a === "share") openAny("https://t.me/share/url?url=" + encodeURIComponent(DATA.link) + "&text=" + encodeURIComponent(plain("main.share_text")));
    else if (a === "templates") go("templates");
    else if (a === "howto") go("howto");
    else if (a === "rules") openRules();
    else if (a === "terms") location.href = "rules.html?v=1";   // в том же окне; «Назад» на rules.html вернёт сюда
    else if (a === "save") saveStory(+b.getAttribute("data-n"));
    else if (a === "pay") { var url = plain(b.getAttribute("data-link")); askWriteAccess(function () { openAny(url); }); }
    else if (a === "studio") toStudio();
  });

  // ---------- экраны ----------
  function topBar(labelKey, act) {
    return '<div class="top"><button class="back" type="button" data-act="' + act + '" aria-label="Назад">' + ICON.back + '</button><div class="top-label">' + T(labelKey) + "</div></div>";
  }
  // «Условия программы» (15.10.2026): отдельная страница rules.html вместо шторки «Все правила».
  function termsLabel() { return plain("common.terms_link") ? T("common.terms_link") : "Условия программы"; }
  function renderMain() {
    var r = DATA.reward === "money" ? "money" : "month";
    var c = DATA.counters || { clicked: 0, joined: 0, gifted: 0 };
    var next = DATA.next_gift_on ? '<div class="pill">' + ICON.clock + "<div>" + T("main.next_gift_" + r, { date: ruDate(DATA.next_gift_on) }) + "</div></div>" : "";
    document.getElementById("s-main").innerHTML =
      topBar("common.back_studio", "back") +
      '<div style="display:flex;flex-direction:column;gap:10px"><h1>' + T("main.title") + '</h1><p class="lead">' + T("main.subtitle_" + r) + "</p></div>" +
      '<div class="card">' +
        '<div class="step"><div class="num">1</div><div class="step-text">' + T("main.step1") + "</div></div>" +
        '<div class="step"><div class="num">2</div><div class="step-text">' + T("main.step2") + "</div></div>" +
        '<div class="step"><div class="num">3</div><div class="step-text">' + T("main.step3_" + r) + "</div></div>" +
      "</div>" +
      '<div style="display:flex;flex-direction:column;gap:12px"><div class="label">' + T("main.link_label") + '</div>' +
        '<div class="linkbox">' + esc(DATA.link.replace(/^https:\/\//, "")) + "</div>" +
        '<div class="row2"><button class="btn" type="button" data-act="copy">' + ICON.copy + T("main.copy") + '</button>' +
        '<button class="btn ghost" type="button" data-act="share">' + ICON.share + T("main.share") + "</button></div></div>" +
      '<button class="tile" type="button" data-act="templates"><span class="sw" aria-hidden="true"><i style="background:#F2B8C9"></i><i style="background:#F7EFE8"></i><i style="background:#B4553F"></i></span>' +
        '<span style="flex:1;display:flex;flex-direction:column;gap:2px"><span class="tile-title">' + T("main.templates_title") + '</span><span class="tile-sub">' + T("main.templates_sub") + "</span></span>" + ICON.chev + "</button>" +
      '<div class="card" style="gap:14px"><div class="label">' + T("main.friends_label") + "</div>" +
        '<div class="counters">' +
          '<div><div class="cnt-n">' + c.clicked + '</div><div class="cnt-l">' + T("main.count_clicked") + "</div></div>" +
          '<div><div class="cnt-n">' + c.joined + '</div><div class="cnt-l">' + T("main.count_joined") + "</div></div>" +
          '<div><div class="cnt-n acc">' + c.gifted + '</div><div class="cnt-l">' + T("main.count_gifted_" + r) + "</div></div>" +
        "</div>" + next + "</div>" +
      '<p class="fine">' + T("main.rules_short") + ' <button type="button" data-act="terms">' + termsLabel() + "</button></p>";
  }
  function storyUrl(n, thumb) {
    return "stories/story" + n + (thumb ? "-thumb" : "") + ".png?v=" + encodeURIComponent(plain("story.version") || "1");
  }
  function renderTemplates() {
    var items = "";
    for (var n = 1; n <= 6; n++) {
      items += '<div class="tpl"><div class="thumb"><img loading="lazy" alt="" src="' + storyUrl(n, true) + '"></div>' +
        '<div class="tpl-name">' + T("story." + n + ".name") + "</div>" +
        '<button class="btn ghost" type="button" data-act="save" data-n="' + n + '">' + ICON.save + T("tpl.save") + "</button></div>";
    }
    document.getElementById("s-templates").innerHTML =
      topBar("tpl.back", "back") +
      '<div style="display:flex;flex-direction:column;gap:10px"><h1 class="sm">' + T("tpl.title") + '</h1><p class="lead" style="font-size:16px">' + T("tpl.subtitle") + "</p></div>" +
      '<div class="grid">' + items + "</div>" +
      '<div class="note">' + ICON.camera + "<div>" + T("tpl.photo_tip") + "</div></div>" +
      '<div class="bottom"><div class="tip">' + ICON.pen + "<div>" + T("tpl.own_phrase_tip") + '</div></div><button class="btn" type="button" data-act="howto">' + T("tpl.howto_button") + " " + ICON.chev + "</button></div>";
  }
  function renderHowto() {
    var sticker = plain("howto.sticker_text");
    document.getElementById("s-howto").innerHTML =
      topBar("howto.back", "back") +
      '<h1 class="sm">' + T("howto.title") + "</h1>" +
      '<div class="step"><div class="num solid">1</div><div class="step-text lg">' + T("howto.step1") + "</div></div>" +
      '<div class="step"><div class="num solid">2</div><div class="step-text lg">' + T("howto.step2") + "</div></div>" +
      '<div class="stickers" aria-hidden="true"><div>МЕСТО</div><div>@УПОМИНАНИЕ</div><div class="on">' + ICON.link + "ССЫЛКА</div><div>ОПРОС</div></div>" +
      '<div class="step"><div class="num solid">3</div><div class="step-text lg">' + T("howto.step3", { sticker: sticker }) + "</div></div>" +
      '<div class="mini-story" aria-hidden="true"><div><i style="width:50px;height:4px;background:#F2B8C9"></i><i style="width:110px"></i><i style="width:96px"></i><i style="width:104px;background:#F2B8C9;margin-top:6px"></i></div>' +
        '<div class="sticker">' + ICON.link + esc(sticker) + "</div></div>" +
      '<div class="note">' + ICON.info + "<div>" + T("howto.note") + "</div></div>" +
      '<button class="btn tall" type="button" data-act="copy">' + ICON.copy + T("howto.copy_again") + "</button>";
  }
  function renderFriend() {
    var name = DATA.inviter_name || "";
    var invited = name ? '<div class="invited"><div class="ava">' + esc(name.charAt(0).toUpperCase()) + "</div><div>" + T("friend.invited_by", { name: name }) + "</div></div>" : "";
    var gift = DATA.gift
      ? '<div class="gift">' + ICON.gift + '<div style="display:flex;flex-direction:column;gap:8px"><div class="gift-title">' + T("friend.gift_title") + "</div>" +
        '<div class="gift-item">' + T("friend.gift_item1") + '</div><div class="gift-item">' + T("friend.gift_item2") + "</div>" +
        // Книга рецептов (15.10.2026): пункт только когда в подарке есть файл (gift.file4_url заполнен).
        (plain("gift.file4_url") ? '<div class="gift-item">' + T("friend.gift_item3") + "</div>" : "") + "</div></div>"
      : '<p class="fine" style="text-align:center">' + T("friend.no_gift_note") + "</p>";
    var pay = "";
    if (plain("link.pay_card")) pay += '<button class="btn tall" type="button" data-act="pay" data-link="link.pay_card">' + T("friend.pay_card") + "</button>";
    if (plain("link.pay_rub")) pay += '<button class="btn tall ghost" type="button" data-act="pay" data-link="link.pay_rub">' + T("friend.pay_rub") + "</button>";
    var s = document.getElementById("s-friend");
    s.style.paddingTop = "28px";
    s.innerHTML = invited +
      '<div style="display:flex;flex-direction:column;gap:10px"><h1>' + T("friend.title") + '</h1><p class="lead">' + T("friend.subtitle") + "</p></div>" +
      '<div class="card" style="gap:14px">' +
        '<div class="feat">' + ICON.book + "<div>" + T("friend.feature1") + "</div></div>" +
        '<div class="feat">' + ICON.dumbbell + "<div>" + T("friend.feature2") + "</div></div>" +
        '<div class="feat">' + ICON.chat + "<div>" + T("friend.feature3") + "</div></div>" +
        '<div class="feat">' + ICON.headphones + "<div>" + T("friend.feature4") + "</div></div></div>" +
      gift +
      '<div style="display:flex;flex-direction:column;gap:10px"><div class="price">' + T("friend.price") +
        (plain("friend.refund_note") ? "<br>" + T("friend.refund_note") : "") + "</div>" + pay + "</div>";
  }
  function message(key, withStudio) {
    document.getElementById("s-message").innerHTML = '<div class="center"><div>' + T(key) + "</div>" +
      (withStudio ? '<button class="btn tall" type="button" data-act="studio">' + T("friend.open_studio") + "</button>" : "") + "</div>";
    stack = ["message"]; show("message");
  }
  function openRules() {
    var el = document.getElementById("rules");
    // Каждая строка правил - отдельный абзац с отступом, иначе пункты слипаются.
    var paras = plain("rules.body").split("\n").filter(function (s) { return s.trim(); })
      .map(function (s) { return '<p style="margin:0">' + md(s) + "</p>"; }).join("");
    el.firstElementChild.innerHTML = '<h1 class="sm">' + T("rules.title") + '</h1><div style="display:flex;flex-direction:column;gap:10px">' + paras + '</div><button class="btn tall" type="button" data-act="back">OK</button>';
    el.hidden = false; syncBack();
  }
  function closeRules() { document.getElementById("rules").hidden = true; syncBack(); }
  document.getElementById("rules").addEventListener("click", function (e) { if (e.target === this) closeRules(); });

  // Сохранить картинку: Telegram 8.0+ скачивает файл сам, раньше показываем картинку для долгого
  // нажатия. Ссылку копируем сразу: на экране «как добавить» обещано «она уже скопирована».
  function saveStory(n) {
    copyText(DATA.link);
    var abs = new URL(storyUrl(n, false), location.href).href;
    if (ver("8.0") && tg.downloadFile) {
      try {
        tg.downloadFile({ url: abs, file_name: "klub-ireny-" + n + ".png" }, function (ok) { if (ok) { toast(T("common.saved")); haptic(); } });
        return;
      } catch (e) { /* ниже запасной путь */ }
    }
    var v = document.getElementById("viewer");
    v.querySelector("img").src = abs; v.querySelector("p").innerHTML = T("common.save_fallback");
    v.hidden = false; syncBack();
  }
  document.querySelector("#viewer button").addEventListener("click", function () { document.getElementById("viewer").hidden = true; syncBack(); });

  // ---------- сервер ----------
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  async function call(action) {
    if (DEMO) {
      var demo = await (await fetch("demo.json", { cache: "no-store" })).json();
      return Object.assign({ texts: demo.texts }, demo.cases[DEMO] || demo.cases.member);
    }
    var body = JSON.stringify({ initData: tg.initData, action: action });
    var last;
    for (var i = 0; i < 3; i++) {
      try {
        var res = await fetch(i === 0 ? API : API_PROXY, { method: "POST", headers: { "Content-Type": "application/json" }, body: body });
        var data = await res.json().catch(function () { return {}; });
        if (res.ok) return data;
        last = new Error("http " + res.status);
        if (res.status < 500) break;     // 4xx повтором не лечится
      } catch (e) { last = e; }
      if (i < 2) await sleep(RETRY_MS[i]);
    }
    throw last || new Error("failed");
  }

  async function start() {
    if (tg) {
      try { tg.ready(); tg.expand(); } catch (e) {}
      try { tg.setHeaderColor("#FBF6F2"); tg.setBackgroundColor("#FBF6F2"); } catch (e) {}
      try { tg.BackButton.onClick(back); } catch (e) {}
    }
    var sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
    var isFriend = DEMO ? /^(friend|nogift|already|self|bad)$/.test(DEMO) : /^ref_/.test(sp || "");
    if (!DEMO && !(tg && tg.initData)) { TX = {}; message("common.error"); document.querySelector("#s-message .center div").textContent = "Открой эту страницу в Телеграме."; return; }
    try {
      DATA = await call(isFriend ? "open" : "me");
      TX = DATA.texts || {};
    } catch (e) {
      TX = { "common.error": "Не получилось загрузить. Проверь интернет и открой ещё раз." };
      message("common.error"); return;
    }
    // Выключатель программы на сервере (REFERRAL_ENABLED=off): без деплоя и без кэша Телеграма.
    if (DATA.state === "paused") {
      if (!TX["common.paused"]) TX["common.paused"] = "Программа на паузе, скоро вернёмся 💜";
      message("common.paused", !isFriend); return;
    }
    if (isFriend) {
      if (DATA.state === "friend") { renderFriend(); stack = ["friend"]; show("friend"); }
      else if (DATA.state === "prior_payer") { DATA.gift = false; renderFriend(); stack = ["friend"]; show("friend"); }
      else if (DATA.state === "already_member") message("friend.already_member", true);
      else if (DATA.state === "self") message("friend.self", true);
      else message("friend.bad_link");
      return;
    }
    if (DATA.state === "ok") {
      renderMain(); renderTemplates(); renderHowto();
      stack = ["main"]; show("main");
      setTimeout(function () { askWriteAccess(); }, 800);
    } else if (DATA.state === "excluded") message("main.excluded", true);
    else if (DATA.state === "not_member") message("main.not_member", true);
    else message("main.not_eligible", true);
  }
  start();
})();
</script>
</body>
