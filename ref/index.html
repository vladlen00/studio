  // ---------- свой текст в шаблоне сторис (16.10.2026) ----------
  // Фон без основного текста и строки над стикером (stories/storyN-bg.png) и их рамки (stories/layout.json) - из
  // render-stories.mjs. Основной текст рисуем сами на canvas: превью и сохранённая картинка - один и тот

  var OWN_MAX = 250;          // знаков: на самой тесной сторис (1 и 4) столько влезает минимальным кеглем
  var CTA_MAX = 30;           // строка над стикером: 30 знаков влезают в ширину подвала (кегль ужимается до CTA_MIN)
  var CTA_MIN = 34;
  var MIN_PX = 34;            // минимальный кегль основного текста на картинке 1080x1920 (обычный 50)
  var LAYOUT = null, BG = {}, ED = { n: 0, raf: 0 };
  function ownKey(n) { return "ref_story_text_" + n; }
  function ownGet(n) { try { var v = localStorage.getItem(ownKey(n)); return v != null && v.trim() ? v : null; } catch (e) { return null; } }
  function ownSet(n, v) { try { if (v == null || v === plain("story." + n + ".body")) localStorage.removeItem(ownKey(n)); else localStorage.setItem(ownKey(n), v); } catch (e) {} }
  function ctaKey(n) { return "ref_story_cta_" + n; }
  function ctaGet(n) { try { var v = localStorage.getItem(ctaKey(n)); return v != null && v.trim() ? v : null; } catch (e) { return null; } }
  function ctaSet(n, v) { try { if (v == null || v === plain("story." + n + ".cta")) localStorage.removeItem(ctaKey(n)); else localStorage.setItem(ctaKey(n), v); } catch (e) {} }
  function hasOwn(n) { return ownGet(n) != null || ctaGet(n) != null; }
  function storyAsset(name) { return "stories/" + name + "?v=" + encodeURIComponent(plain("story.version") || "1"); }
  function loadLayout() {
    if (LAYOUT) return Promise.resolve(LAYOUT);
    return fetch(storyAsset("layout.json")).then(function (r) { if (!r.ok) throw new Error("layout " + r.status); return r.json(); })
      .then(function (j) { LAYOUT = j; return j; });

    return BG[n];

  // Перенос по словам с учётом своих переводов строк; слово длиннее строки режем по буквам (Array.from: эмодзи целиком).
  function wrapLines(ctx, text, maxW) {
    var out = [];
    String(text).replace(/\r/g, "").split("\n").forEach(function (para) {
      var words = para.split(/ +/), cur = "";
      if (!para.trim()) { out.push(""); return; }
      words.forEach(function (w) {
        if (!w) return;
        var t = cur ? cur + " " + w : w;
        if (ctx.measureText(t).width <= maxW) { cur = t; return; }
        if (cur) out.push(cur);
        cur = "";
        if (ctx.measureText(w).width <= maxW) { cur = w; return; }
        Array.from(w).forEach(function (ch) { if (ctx.measureText(cur + ch).width > maxW && cur) { out.push(cur); cur = ch; } else cur += ch; });
      });
      if (cur) out.push(cur);
    });
    return out;
  }
  // Рисует сторис n с текстом text на canvas 1080x1920. Возвращает { fits, px }.
  function drawStory(cv, n, text, cta, bg) {
    var L = LAYOUT[n], ctx = cv.getContext("2d");
    cv.width = bg.naturalWidth; cv.height = bg.naturalHeight;
    ctx.drawImage(bg, 0, 0);
    var px = L.size, lines, lineH, room = L.bottom - L.y;
    for (;;) {
      ctx.font = "400 " + px + "px Onest, system-ui, sans-serif";
      lines = wrapLines(ctx, text, L.w); lineH = px * L.lh;
      if (lines.length * lineH <= room || px <= MIN_PX) break;
      px -= 1;
    }
    var fits = lines.length * lineH <= room + 0.5;
    ctx.fillStyle = L.color; ctx.textBaseline = "alphabetic";
    var m = ctx.measureText("Ag"), asc = m.fontBoundingBoxAscent || px * 0.93, desc = m.fontBoundingBoxDescent || px * 0.24;
    var shift = (lineH - (asc + desc)) / 2 + asc;     // как полу-интерлиньяж в HTML
    lines.forEach(function (ln, i) { if (ln) ctx.fillText(ln, L.x, L.y + i * lineH + shift); });
    // Строка над стикером: текст и стрелка вниз (та же 24-клеточная иконка, что в шаблоне) по центру подвала.
    var C = L.cta, cpx = C.size, tw;
    for (;;) {
      ctx.font = C.weight + " " + cpx + "px Onest, system-ui, sans-serif";
      tw = ctx.measureText(cta).width;
      if (tw + C.gap + C.icon <= C.maxW || cpx <= CTA_MIN) break;
      cpx -= 1;
    }
    var ctaFits = tw + C.gap + C.icon <= C.maxW + 0.5, total = tw + C.gap + C.icon, x0 = C.cx - total / 2, mid = C.y + C.h / 2;
    var cm = ctx.measureText("Ag"), ca = cm.fontBoundingBoxAscent || cpx * 0.93, cd = cm.fontBoundingBoxDescent || cpx * 0.24;
    ctx.fillStyle = C.color; ctx.fillText(cta, x0, mid + (ca - cd) / 2);
    var k = C.icon / 24, ix = x0 + tw + C.gap, iy = mid - C.icon / 2;
    ctx.strokeStyle = C.color; ctx.lineWidth = 2 * k; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(ix + 12 * k, iy + 5 * k); ctx.lineTo(ix + 12 * k, iy + 19 * k);
    ctx.moveTo(ix + 6 * k, iy + 13 * k); ctx.lineTo(ix + 12 * k, iy + 19 * k); ctx.lineTo(ix + 18 * k, iy + 13 * k); ctx.stroke();
    return { fits: fits && ctaFits, bodyFits: fits, ctaFits: ctaFits, px: px };
  }

    cancelAnimationFrame(ED.raf);
    ED.raf = requestAnimationFrame(function () {
      var tx = document.getElementById("ed-tx"), ci = document.getElementById("ed-cta"), cv = document.getElementById("ed-cv");
      if (!tx || !ci || !cv || !LAYOUT) return;
      var n = ED.n, val = tx.value, cval = ci.value;
      document.getElementById("ed-cnt").textContent = val.length + " / " + OWN_MAX;   // как maxlength поля
      loadBg(n).then(function (bg) {
        var r = drawStory(cv, n, val, cval, bg), warn = document.getElementById("ed-warn"), empty = !val.trim() || !cval.trim();
        warn.textContent = empty ? "Напиши хотя бы пару слов в обоих полях" : !r.ctaFits ? "Строка над ссылкой не помещается: сократи её"
          : !r.bodyFits ? "Не помещается: сократи текст или убери пустые строки" : "";
        warn.className = r.fits && !empty ? "" : "bad";
        document.getElementById("ed-save").disabled = !r.fits || empty;
      });
    });
  }
  function resetOwn() {
    var tx = document.getElementById("ed-tx"); if (!tx) return;
    tx.value = plain("story." + ED.n + ".body"); ownSet(ED.n, null);
    var ci = document.getElementById("ed-cta"); if (ci) ci.value = plain("story." + ED.n + ".cta");
    ctaSet(ED.n, null); redraw();
  }
  // Своя картинка: системное «Поделиться» с файлом (сразу в Фото или Инстаграм); без него - через сервер и
  // tg.downloadFile (uploadOwn); иначе картинка на весь экран для долгого нажатия.
  function saveOwn(n) {
    var inEd = n === ED.n && document.getElementById("ed-tx");
    var text = inEd ? document.getElementById("ed-tx").value : ownGet(n), cta = inEd ? document.getElementById("ed-cta").value : ctaGet(n);
    if (!inEd && !hasOwn(n)) { saveStory(n); return; }
    if (text == null) text = plain("story." + n + ".body");
    if (cta == null) cta = plain("story." + n + ".cta");
    copyText(DATA.link);
    prepare(n, text).then(function (r) {
      var cv = document.createElement("canvas"), res = drawStory(cv, n, text, cta, r[1]);
      if (!res.fits) { toast("Не помещается: сократи текст"); return; }
      var url = cv.toDataURL("image/png"), name = "klub-ireny-" + n + ".png";
      var showViewer = function () {
        var v = document.getElementById("viewer");
        v.querySelector("img").src = url; v.querySelector("p").innerHTML = T("common.save_fallback");
        v.hidden = false; syncBack();
      };
      if (!CAN_SHARE_PNG && CAN_DOWNLOAD) { uploadOwn(n, url); return; }
      if (!cv.toBlob || !window.File || !navigator.canShare) { showViewer(); return; }
      cv.toBlob(function (blob) {
        try {
          var file = new File([blob], name, { type: "image/png" });
          if (!navigator.canShare({ files: [file] })) { showViewer(); return; }
          navigator.share({ files: [file] }).then(function () { haptic(); }).catch(function (e) { if (!e || e.name !== "AbortError") showViewer(); });
        } catch (e) { showViewer(); }
      }, "image/png");
    }).catch(function () { toast(T("common.error")); });
  }
  // Android и Telegram Desktop: PNG на сервер (referral-api story_upload, приватный бакет, файл живёт час),
  // в ответ подписанный адрес на 10 минут -> tg.downloadFile. Адрес того же маршрута, каким дошёл запрос
  // (прямой или прокси biohack). Ссылка уже скопирована в saveOwn, как при сохранении шаблона.
  var UPLOADING = false;
  function uploadOwn(n, dataUrl) {
    if (UPLOADING) return;
    var png = dataUrl.slice(dataUrl.indexOf(",") + 1);
    if (png.length * 3 / 4 > 3 * 1024 * 1024) { toast("Картинка слишком большая: сократи текст"); return; }
    UPLOADING = true; toast("Готовлю картинку…");
    call("story_upload", { n: n, png: png }).then(function (r) {
      if (r.state === "rate_limited") { toast("Сохранять можно до 30 раз в час, попробуй позже"); return; }
      if (r.state !== "ok" || !r.url) { toast(T("common.error")); return; }
      tg.downloadFile({ url: LAST_ROUTE === 0 ? r.url : r.url_proxy, file_name: r.file_name || "klub-ireny-" + n + ".png" },
        function (ok) { if (ok) { toast(T("common.saved")); haptic(); } });
    }).catch(function () { toast(T("common.error")); })
      .then(function () { UPLOADING = false; });
  }
  // Превью в сетке шаблонов: со своим текстом рисуем его, иначе готовая картинка с сервера.
  function ownThumbs() {
    for (var n = 1; n <= 6; n++) (function (n) {
      var img = document.querySelector('img[data-thumb="' + n + '"]');
      if (!hasOwn(n) || !img) return;
      var own = ownGet(n) != null ? ownGet(n) : plain("story." + n + ".body"), cta = ctaGet(n) != null ? ctaGet(n) : plain("story." + n + ".cta");
      prepare(n, own).then(function (r) {
        var big = document.createElement("canvas"); drawStory(big, n, own, cta, r[1]);
        var cv = document.createElement("canvas"); cv.width = 360; cv.height = 640;
        cv.getContext("2d").drawImage(big, 0, 0, 360, 640); img.src = cv.toDataURL("image/jpeg", 0.85);
      }).catch(function () {});
    })(n);
  }

  // ---------- сервер ----------
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  var LAST_ROUTE = 0;   // 0 - supabase.co напрямую, 1 - прокси biohack: какой ответил последним
  async function call(action, extra) {
    if (DEMO) {
      var demo = await (await fetch("demo.json", { cache: "no-store" })).json();
      return Object.assign({ texts: demo.texts }, demo.cases[DEMO] || demo.cases.member);
    }
    var body = JSON.stringify(Object.assign({ initData: tg.initData, action: action }, extra || {}));
    var last;
    for (var i = 0; i < 3; i++) {
      try {
        var res = await fetch(i === 0 ? API : API_PROXY, { method: "POST", headers: { "Content-Type": "application/json" }, body: body });
        var data = await res.json().catch(function () { return {}; });
        if (res.ok) { LAST_ROUTE = i === 0 ? 0 : 1; return data; }
        last = new Error("http " + res.status);
        if (res.status < 500) break;     // 4xx повтором не лечится
      } catch (e) { last = e; }
      if (i < 2) await sleep(RETRY_MS[i]);
    }
    throw last || new Error("failed");
  }

  async function start() {
    if (tg) {
      try { tg.ready(); tg.expand(); } catch (e) {}
      try { tg.setHeaderColor("#FBF6F2"); tg.setBackgroundColor("#FBF6F2"); } catch (e) {}
      try { tg.BackButton.onClick(back); } catch (e) {}
    }
    var sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
    // home=1 - вход с плитки студии (ворота 2): всегда экран участницы, даже если студию открыли по ref_.
    var home = new URLSearchParams(location.search).get("home") === "1";
    var isFriend = DEMO ? /^(friend|nogift|already|self|bad)$/.test(DEMO) : /^ref_/.test(sp || "") && !home;
    if (!DEMO && !(tg && tg.initData)) { TX = {}; message("common.error"); document.querySelector("#s-message .center div").textContent = "Открой эту страницу в Телеграме."; return; }
    try {
      DATA = await call(isFriend ? "open" : "me");
      TX = DATA.texts || {};
    } catch (e) {
      TX = { "common.error": "Не получилось загрузить. Проверь интернет и открой ещё раз." };
      message("common.error"); return;
    }
    // Выключатель программы на сервере (REFERRAL_ENABLED=off): без деплоя и без кэша Телеграма.
    if (DATA.state === "paused") {
      if (!TX["common.paused"]) TX["common.paused"] = "Программа на паузе, скоро вернёмся 💜";
      message("common.paused", !isFriend); return;
    }
    if (isFriend) {
      if (DATA.state === "friend") { renderFriend(); stack = ["friend"]; show("friend"); }
      else if (DATA.state === "prior_payer") { DATA.gift = false; renderFriend(); stack = ["friend"]; show("friend"); }
      else if (DATA.state === "already_member") message("friend.already_member", true);
      else if (DATA.state === "self") message("friend.self", true);
      else message("friend.bad_link");
      return;
    }
    if (DATA.state === "ok") {
      renderMain(); renderTemplates(); renderHowto();
      stack = ["main"]; show("main");
      setTimeout(function () { askWriteAccess(); }, 800);
    } else if (DATA.state === "excluded") message("main.excluded", true);
    else if (DATA.state === "not_member") message("main.not_member", true);
    else message("main.not_eligible", true);
  }
  start();
})();
</script>
