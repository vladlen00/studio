<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Условия программы «Приведи подругу»</title>
<script src="../telegram-web-app.js"></script>
<style>
/* Условия программы «Приведи подругу» (15.10.2026). Постоянный публичный адрес: поддержка шлёт
   ссылку и ссылается на пункт (rules.html#p6). Открывается и в мини-приложении, и в браузере.
   Тексты пунктов из referral_texts (rules.*) через referral-api action=rules; нет ответа или ключа ->
   текст из этого файла. Стиль и шрифты как у ref/. */
@font-face{font-family:Onest;font-style:normal;font-weight:400 700;font-display:swap;src:url(fonts/onest-normal-cyrillic.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Onest;font-style:normal;font-weight:400 700;font-display:swap;src:url(fonts/onest-normal-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Playfair;font-style:normal;font-weight:600;font-display:swap;src:url(fonts/playfair-normal-cyrillic.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Playfair;font-style:normal;font-weight:600;font-display:swap;src:url(fonts/playfair-normal-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122,U+FEFF,U+FFFD}
:root{--bg:#FBF6F2;--text:#2B1D26;--body:#4A3742;--muted:#6E5A64;--accent:#9C4F6B;--soft:#F3E6EA;--line:#EAD9DF;--card:#FFFFFF;--dark:#2B1D26;--pink:#F2B8C9}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Onest,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;height:44px;margin-left:-10px}
.top[hidden]{display:none}
.back{height:44px;border:0;background:none;color:var(--muted);font-family:inherit;font-size:15px;font-weight:500;display:flex;align-items:center;gap:4px;padding:0 10px;border-radius:22px;cursor:pointer}
h1{margin:0;font-family:Playfair,Georgia,serif;font-weight:600;font-size:30px;line-height:1.15}
.lead{margin:0;font-size:16px;line-height:1.5;color:var(--body)}
.fig{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px}
.fig svg{display:block;width:100%;height:auto}
.fig-cap{margin:0 0 10px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
li{display:flex;gap:12px;align-items:flex-start;scroll-margin-top:16px}
li:target .n{background:var(--accent);color:#fff}
.n{flex:none;width:30px;height:30px;border-radius:15px;background:var(--soft);color:var(--accent);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;text-decoration:none}
.t{font-size:15px;line-height:1.55;color:var(--body);padding-top:4px;min-width:0}
.t p{margin:0}
.t ul{margin:6px 0 0;padding-left:18px}
.t li{display:list-item;margin:4px 0}
.t b{color:var(--text)}
.t a{color:var(--accent)}
.foot{margin:6px 0 0;font-size:13px;line-height:1.5;color:var(--muted)}
.foot a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <div class="top" id="top" hidden><button class="back" type="button" id="back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span id="back-l">Назад</span></button></div>
  <h1 id="title"></h1>
  <div class="fig"><p class="fig-cap" id="flow-cap"></p><svg id="flow" role="img"></svg></div>
  <div class="fig"><p class="fig-cap" id="kinds-cap"></p><svg id="kinds" role="img"></svg></div>
  <ol id="points"></ol>
  <p class="foot" id="foot"></p>
</main>
<script>
(function () {
  "use strict";
  var API = "https://kjzxrpwqyyjcykwbqskn.supabase.co/functions/v1/referral-api";
  // Текст по умолчанию (15.10.2026, утверждён Владленом). Правка - строка в referral_texts.
  var D = {
    "rules.page_title": "Условия программы «Приведи подругу»",
    "rules.flow_caption": "Как это работает",
    "rules.flow1": "Ты делишься ссылкой",
    "rules.flow2": "Подруга впервые оплачивает клуб (в течение 30 дней)",
    "rules.flow3": "16 дней проверки",
    "rules.flow4": "Подарок тебе (если твоя подписка активна)",
    "rules.kinds_caption": "Какой подарок",
    "rules.kind_card_title": "Платишь картой (бот клуба)",
    "rules.kind_card_body": "Месяц клуба, следующее списание сдвигается на месяц",
    "rules.kind_rub_title": "Платишь в рублях или по СБП (Tribute)",
    "rules.kind_rub_body": "13 € в USDT в Telegram Wallet",
    "rules.p1": "**Кто участвует.** Участницы Телеграм-клуба «Женский Биохакинг с Иреной Пол» с активной платной подпиской. Подписчицы бесплатного канала в программе не участвуют.",
    "rules.p2": "**Твоя ссылка.** У каждой участницы своя личная ссылка. Делись ей в личных сообщениях и в сторис. Ссылка на саму себя не засчитывается.",
    "rules.p3": "**Когда подруга засчитывается.** Подруга перешла по твоей ссылке и в течение 30 дней после перехода впервые оплатила клуб любым способом на экране приглашения. Если она переходила по ссылкам нескольких участниц, засчитывается последняя ссылка.",
    "rules.p4": "**Когда подруга не засчитывается:**\n- она уже была участницей клуба раньше (хотя бы одна оплата в прошлом);\n- она оплатила позже чем через 30 дней после перехода;\n- она вернула деньги за клуб.",
    "rules.p5": "**Когда приходит подарок.** Через 16 дней после оплаты подруги: 14 дней это срок, в который можно вернуть деньги, и ещё 2 дня на проверку. Пока идут эти дни, подарок в ожидании.",
    "rules.p6": "**Главное условие.** Подарок начисляется, только если в день начисления твоя подписка на клуб активна. Если подписка закончилась или отменена, подарок за эту подругу не начисляется и не переносится на потом. Вернёшься в клуб, и следующие подруги снова принесут подарок.",
    "rules.p7": "**Какой подарок:**\n- платишь картой через бот клуба: месяц клуба в подарок, твоё следующее списание сдвигается на месяц вперёд;\n- платишь в рублях или по СБП через Tribute: 13 € в USDT на твой Telegram Wallet. Если у тебя в Телеграме нет имени пользователя (username), бот попросит написать слово ПОДАРОК в @biohack_support;\n- если у тебя есть обе подписки, подарок месяцем клуба.",
    "rules.p8": "**Сколько подарков.** Не больше 12 подарков за 12 месяцев. За одну подругу подарок дают один раз.",
    "rules.p9": "**Возвраты.** Если подруга вернула деньги до начисления, подарка за неё нет. Если у двух приглашённых тобой подруг были возвраты, участие в программе прекращается.",
    "rules.p10": "**Проверка.** Если за сутки засчитано больше трёх подруг, приглашения проходят ручную проверку, и подарок может прийти позже. Если мы видим признаки обмана (ненастоящие аккаунты, оплаты самой себе), мы вправе не засчитать приглашение.",
    "rules.p11": "**Подарок подруге.** Подруга, которая впервые вступила в клуб по твоей ссылке, получает от Ирены подарок: шпаргалки по анализам и добавкам.",
    "rules.p12": "**Изменения.** Мы можем изменить условия или приостановить программу. Подарки за подруг, которые оплатили клуб до изменений, сохраняются по старым условиям.",
    "rules.p13": "**Вопросы.** Пиши в @biohack_support, разберёмся.",
    "rules.points_count": "13"
  };
  var TX = {};
  var T = function (k) { var v = TX[k]; return v != null && String(v).trim() ? String(v) : (D[k] || ""); };
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function inline(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/@([A-Za-z0-9_]{5,})/g, '<a href="https://t.me/$1">@$1</a>'); }
  // Строки «- ...» -> список, остальное -> абзацы.
  function block(s) {
    var out = "", list = [];
    var flush = function () { if (list.length) { out += "<ul>" + list.map(function (x) { return "<li>" + inline(x) + "</li>"; }).join("") + "</ul>"; list = []; } };
    String(s).split("\n").forEach(function (line) {
      var m = /^\s*-\s+(.*)$/.exec(line);
      if (m) list.push(m[1]); else if (line.trim()) { flush(); out += "<p>" + inline(line) + "</p>"; }
    });
    flush(); return out;
  }

  // ---------- схемы (inline SVG, перенос строк по ширине) ----------
  var NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, parent) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
  function wrap(text, maxChars) {
    var words = String(text).split(/\s+/), lines = [], cur = "";
    words.forEach(function (w) { if ((cur + " " + w).trim().length > maxChars && cur) { lines.push(cur); cur = w; } else cur = (cur + " " + w).trim(); });
    if (cur) lines.push(cur); return lines;
  }
  function textBlock(parent, x, y, lines, size, weight, fill, lh) {
    var t = el("text", { x: x, y: y, "font-size": size, "font-weight": weight, fill: fill, "font-family": "Onest, system-ui, sans-serif" }, parent);
    lines.forEach(function (l, i) { var s = el("tspan", { x: x, dy: i ? lh : 0 }, t); s.textContent = l; });
    return lines.length * lh;
  }
  function drawFlow() {
    var svg = $("flow"), W = 320, pad = 14, boxX = 46, boxW = W - boxX, y = 0, steps = [T("rules.flow1"), T("rules.flow2"), T("rules.flow3"), T("rules.flow4")];
    svg.innerHTML = ""; svg.setAttribute("aria-label", steps.join(". "));
    steps.forEach(function (s, i) {
      var lines = wrap(s, 30), h = Math.max(46, pad * 2 + lines.length * 20 - 4), last = i === steps.length - 1;
      el("rect", { x: boxX, y: y, width: boxW, height: h, rx: 14, fill: last ? "#2B1D26" : "#F3E6EA" }, svg);
      el("circle", { cx: 18, cy: y + h / 2, r: 16, fill: last ? "#9C4F6B" : "#FFFFFF", stroke: "#9C4F6B", "stroke-width": 1.5 }, svg);
      var n = el("text", { x: 18, y: y + h / 2 + 5, "text-anchor": "middle", "font-size": 15, "font-weight": 600, fill: last ? "#FFFFFF" : "#9C4F6B", "font-family": "Onest, system-ui, sans-serif" }, svg); n.textContent = String(i + 1);
      textBlock(svg, boxX + 14, y + h / 2 - (lines.length - 1) * 10 + 5, lines, 15, last ? 600 : 500, last ? "#FBF6F2" : "#2B1D26", 20);
      y += h;
      if (!last) { el("path", { d: "M18 " + (y - h / 2 + 18) + " V" + (y + 14 + 8), stroke: "#EAD9DF", "stroke-width": 2 }, svg);
        el("path", { d: "M" + (boxX + boxW / 2 - 6) + " " + (y + 4) + " l6 7 l6 -7", fill: "none", stroke: "#9C4F6B", "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round" }, svg); y += 16; }
    });
    svg.setAttribute("viewBox", "0 0 " + W + " " + y);
  }
  function drawKinds() {
    var svg = $("kinds"), W = 320, gap = 10, cw = (W - gap) / 2, pad = 12;
    var cards = [{ t: T("rules.kind_card_title"), b: T("rules.kind_card_body"), icon: "card" }, { t: T("rules.kind_rub_title"), b: T("rules.kind_rub_body"), icon: "wallet" }];
    svg.innerHTML = ""; svg.setAttribute("aria-label", cards.map(function (c) { return c.t + ": " + c.b; }).join(". "));
    var tl = cards.map(function (c) { return wrap(c.t, 16); }), bl = cards.map(function (c) { return wrap(c.b, 16); });
    var h = pad + 34 + 10 + Math.max(tl[0].length, tl[1].length) * 18 + 8 + Math.max(bl[0].length, bl[1].length) * 18 + pad;
    cards.forEach(function (c, i) {
      var x = i * (cw + gap);
      el("rect", { x: x + .75, y: .75, width: cw - 1.5, height: h - 1.5, rx: 16, fill: i ? "#FFFFFF" : "#F3E6EA", stroke: "#EAD9DF", "stroke-width": 1.5 }, svg);
      var g = el("g", { transform: "translate(" + (x + pad) + "," + pad + ")" }, svg);
      el("rect", { x: 0, y: 0, width: 34, height: 34, rx: 10, fill: "#9C4F6B" }, g);
      if (c.icon === "card") { el("rect", { x: 7, y: 10, width: 20, height: 14, rx: 2.5, fill: "none", stroke: "#fff", "stroke-width": 1.8 }, g); el("path", { d: "M7 15 H27", stroke: "#fff", "stroke-width": 1.8 }, g); }
      else { el("path", { d: "M8 12 h16 a2 2 0 0 1 2 2 v8 a2 2 0 0 1 -2 2 h-16 a2 2 0 0 1 -2 -2 v-8 a2 2 0 0 1 2 -2 z M21 18 h2", fill: "none", stroke: "#fff", "stroke-width": 1.8, "stroke-linecap": "round" }, g); }
      var ty = pad + 34 + 10 + 13;
      var th = textBlock(svg, x + pad, ty, tl[i], 14, 600, "#2B1D26", 18);
      textBlock(svg, x + pad, ty + Math.max(tl[0].length, tl[1].length) * 18 + 8, bl[i], 14, 400, "#4A3742", 18);
    });
    svg.setAttribute("viewBox", "0 0 " + W + " " + h);
  }

  function render() {
    document.title = T("rules.page_title");
    $("title").textContent = T("rules.page_title");
    $("flow-cap").textContent = T("rules.flow_caption");
    $("kinds-cap").textContent = T("rules.kinds_caption");
    var n = parseInt(T("rules.points_count"), 10) || 13, items = "";
    for (var i = 1; i <= n; i++) {
      var s = T("rules.p" + i); if (!s) continue;
      items += '<li id="p' + i + '"><a class="n" href="#p' + i + '" aria-label="Пункт ' + i + '">' + i + '</a><div class="t">' + block(s) + "</div></li>";
    }
    $("points").innerHTML = items;
    drawFlow(); drawKinds();
    if (location.hash && /^#p\d+$/.test(location.hash)) { var t = document.querySelector(location.hash); if (t) t.scrollIntoView(); }
  }

  // «Назад»: в мини-приложении кнопка Телеграма и своя сверху; в браузере - своя, если есть куда.
  var tg = window.Telegram && window.Telegram.WebApp;
  var inTg = !!(tg && tg.initData);
  function goBack() { if (history.length > 1) history.back(); else location.href = "./"; }
  if (inTg) {
    try { tg.ready(); tg.setHeaderColor("#FBF6F2"); tg.setBackgroundColor("#FBF6F2"); tg.BackButton.show(); tg.BackButton.onClick(goBack); } catch (e) {}
  }
  if (inTg || history.length > 1) { $("top").hidden = false; $("back").onclick = goBack; }

  render();   // сразу текст из файла, потом подменяем свежим из базы
  fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "rules" }) })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) { if (d && d.texts) { TX = d.texts; render(); } })
    .catch(function () { /* остаёмся на тексте из файла */ });
})();
</script>
</body>
</html>
